domain: modelspec.training

summary: The reproducibility record of one training run (DESIGN.md § 6.1).

types:
  - name: modelspec.training.TrainingRunId
    kind: newtype
    of: Uuid

  - name: modelspec.training.OptimizerKind
    kind: enum
    naming:
      summary: SGD from M0; AdamW with weight decay joins at M3 (DESIGN.md § 1, § 11 iteration 4; epic:bert-from-scratch). The CLI accepts only `sgd` until then.
    variants: [Sgd, AdamW]

  - name: modelspec.training.LearningRateSchedule
    kind: struct
    naming:
      summary: How the learning rate varies over steps; a linear warmup over the first warmup_steps steps up to OptimizerConfig.learning_rate (epic:bert-from-scratch, AdamW with warmup).
    # UNMAPPED: the epic names warmup only; the rate after warmup (constant, linear decay to zero,
    # another shape) and whether warmup starts at zero are not settled. Open question.
    fields:
      - name: warmup_steps
        type: Integer
    invariants:
      - warmup_steps >= 0

  - name: modelspec.training.OptimizerConfig
    kind: struct
    naming:
      summary: Optimizer hyperparameters, recorded for reproducibility (DESIGN.md § 6.1). The AdamW fields are present exactly when kind is AdamW (Loshchilov and Hutter, decoupled weight decay); its first and second moments are a checkpoint's optimizer slots (DESIGN.md § 6.2).
    fields:
      - name: kind
        type: modelspec.training.OptimizerKind
      - name: learning_rate
        type: Binary64
        summary: The base learning rate; the peak rate when a schedule is present.
      - name: weight_decay
        type: Optional<Binary64>
        summary: AdamW decoupled weight decay coefficient (epic:bert-from-scratch).
      - name: beta1
        type: Optional<Binary64>
        summary: AdamW first-moment decay rate.
      - name: beta2
        type: Optional<Binary64>
        summary: AdamW second-moment decay rate.
      - name: epsilon
        type: Optional<Binary64>
        summary: AdamW denominator term.
      - name: schedule
        type: Optional<modelspec.training.LearningRateSchedule>
        summary: Absent means a constant learning rate, as M0 SGD has.
        # UNMAPPED: whether a schedule applies to SGD too or only to AdamW is not settled; it is
        # admitted for both. Open question.
    invariants:
      - any:
          - all:
              - kind == Sgd
              - not defined(weight_decay)
              - not defined(beta1)
              - not defined(beta2)
              - not defined(epsilon)
          - all:
              - kind == AdamW
              - defined(weight_decay)
              - defined(beta1)
              - defined(beta2)
              - defined(epsilon)

  - name: modelspec.training.RngAlgorithm
    kind: enum
    naming:
      summary: The counter-based PRNG of DESIGN.md § 2.3.
    variants: [Philox4x32x10]

  - name: modelspec.training.RngState
    kind: struct
    naming:
      summary: RNG algorithm, seed and counter position (DESIGN.md § 2.3, § 6.1, § 6.2).
    fields:
      - name: algorithm
        type: modelspec.training.RngAlgorithm
      - name: seed
        type: Integer
      - name: counter
        type: Integer

entities:
  - name: modelspec.training.TrainingRun
    naming:
      summary: A run of one compiled artifact, with what § 6.1 says must be recorded to reproduce it. Source hash, compiler version, tensor shapes, compile flags (fast_math, deterministic) and backend are read through the artifact.
    identity:
      name: training_run_id
      type: modelspec.training.TrainingRunId
    fields:
      - name: artifact_id
        type: modelspec.artifact.ArtifactId
      - name: steps
        type: Integer
        summary: TrainConfig.steps, the steps of this invocation counted from start_step, so the run ends at start_step + steps (DESIGN.md § 6).
      - name: checkpoint_every
        type: Optional<Integer>
        summary: TrainConfig.checkpoint_every, a positive step interval; absent means no periodic checkpoints (DESIGN.md § 6).
      - name: start_step
        type: Integer
        summary: The step number the run started at; 0 unless it resumed from a checkpoint (DESIGN.md § 6.1 step number, § 9 gate 7).
      - name: current_step
        type: Integer
        summary: The step number the run has reached; current_step <= start_step + steps, where the run ends (DESIGN.md § 6, step counter; § 6.1 step number). ESS cannot add two facts, so this bound is not an invariant.
      - name: resumed_from_checkpoint_id
        type: Optional<modelspec.checkpoint.CheckpointId>
        summary: The checkpoint a resumed run loaded; start_step equals its step (DESIGN.md § 6.2, § 9 gate 7).
      - name: optimizer
        type: modelspec.training.OptimizerConfig
      - name: rng
        type: modelspec.training.RngState
        summary: The RNG state the run started from; rng.seed is the run's single seed (DESIGN.md § 6.1).
      - name: device_profile_id
        type: Optional<modelspec.device.DeviceProfileId>
        summary: Present exactly when the artifact's backend is Vulkan; a CPU run has no Vulkan device (DESIGN.md § 6.1 backend/device/driver). ESS cannot state the rule across the two entities.
    invariants:
      - start_step >= 0
      - current_step >= start_step
      - steps >= 0
      - any:
          - not defined(checkpoint_every)
          - checkpoint_every > 0
      - any:
          - defined(resumed_from_checkpoint_id)
          - start_step == 0
    relations:
      - name: artifact
        kind: references
        target: modelspec.artifact.CompiledArtifact
        cardinality: one
        via: artifact_id
      - name: device
        kind: references
        target: modelspec.device.DeviceProfile
        cardinality: one
        via: device_profile_id
      - name: resumed_from
        kind: references
        target: modelspec.checkpoint.Checkpoint
        cardinality: one
        via: resumed_from_checkpoint_id
      # The run's event stream: one event per step and per lifecycle change, each describing this
      # run and meaningless without it (epic:training-observatory).
      - name: events
        kind: owns
        target: modelspec.observatory.RunEvent
        cardinality: many
        via: training_run_id
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]
