domain: modelspec.checkpoint

summary: The versioned `.msckpt` package and its structured manifest (DESIGN.md § 6.2).

types:
  - name: modelspec.checkpoint.CheckpointId
    kind: newtype
    of: Uuid

  - name: modelspec.checkpoint.ParameterRecordId
    kind: newtype
    of: Uuid

  - name: modelspec.checkpoint.ParameterPath
    kind: newtype
    of: String
    naming:
      summary: A stable canonical parameter path such as `TinyMLP.fc1.weight` (DESIGN.md § 2.3).

  - name: modelspec.checkpoint.DType
    kind: enum
    variants: [F32]

entities:
  - name: modelspec.checkpoint.Checkpoint
    naming:
      summary: One `.msckpt` file; loadable by the CPU backend whichever backend wrote it (DESIGN.md § 6.2).
    identity:
      name: checkpoint_id
      type: modelspec.checkpoint.CheckpointId
    fields:
      - name: format_version
        type: Integer
      - name: schema_hash
        type: modelspec.artifact.ContentHash
        summary: Compiler/model schema hash from the manifest (DESIGN.md § 6.2).
      - name: step
        type: Integer
      - name: payload_hash
        type: Optional<modelspec.artifact.ContentHash>
        summary: Optional verification hash of the payload (DESIGN.md § 6.2).
    # UNMAPPED: DESIGN.md § 6.2 lists "RNG and step state" and "optimizer state descriptors" in the
    # manifest without their shape. The RNG is a counter-based PRNG (§ 2.3) whose algorithm is not
    # chosen yet. Open question for the owner.
    # UNMAPPED: whether a checkpoint references the TrainingRun that wrote it, and with what
    # cardinality. § 6.2 makes a checkpoint loadable on its own; nothing says it names its run.
    relations:
      - name: parameters
        kind: owns
        target: modelspec.checkpoint.ParameterRecord
        cardinality: many
        via: checkpoint_id
    lifecycle:
      initial: Written
      states: [Written]
      terminal: [Written]

  - name: modelspec.checkpoint.ParameterRecord
    naming:
      summary: One tensor in a checkpoint's payload, addressed by offset and length (DESIGN.md § 6.2).
    identity:
      name: parameter_record_id
      type: modelspec.checkpoint.ParameterRecordId
    fields:
      - name: checkpoint_id
        type: modelspec.checkpoint.CheckpointId
      - name: path
        type: modelspec.checkpoint.ParameterPath
      - name: dtype
        type: modelspec.checkpoint.DType
      - name: shape
        type: List<Integer>
      - name: offset
        type: Integer
      - name: length
        type: Integer
    invariants:
      - offset >= 0
      - length > 0
    lifecycle:
      initial: Written
      states: [Written]
      terminal: [Written]
