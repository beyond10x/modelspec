domain: modelspec.artifact

summary: What the compiler emits and the runtime loads without reparsing source (DESIGN.md § 7.1).

types:
  - name: modelspec.artifact.ArtifactId
    kind: newtype
    of: Uuid

  - name: modelspec.artifact.KernelModuleId
    kind: newtype
    of: Uuid

  - name: modelspec.artifact.ContentHash
    kind: newtype
    of: String
    alphabet: "0123456789abcdef"
    invariants:
      - value.count == 64
    naming:
      summary: A blake3 digest under explicit serialization and version rules (DESIGN.md § 7), written as its 32 bytes in 64 lowercase hexadecimal digits (story:content-hash-schema-constrained).

  - name: modelspec.artifact.Backend
    kind: enum
    variants: [Cpu, Vulkan]

  - name: modelspec.artifact.ParameterSpec
    kind: struct
    naming:
      summary: One parameter the artifact reads and updates, by its stable path (DESIGN.md § 2.3, § 6.2).
    fields:
      - name: param
        type: Integer
        summary: The parameter's number in the Tensor IR of the compiled step (DESIGN.md § 3.1); the stable identity is the path.
      - name: path
        type: modelspec.checkpoint.ParameterPath
      - name: canonical_parameter_id
        type: Integer
        summary: The first 8 bytes of blake3 of the canonical path, read little-endian as an unsigned 64-bit integer; with the global seed it selects the parameter's initial values (DESIGN.md § 2.3).
      - name: dtype
        type: modelspec.checkpoint.DType
      - name: shape
        type: modelspec.checkpoint.Shape
      - name: views
        type: List<modelspec.artifact.BufferView>
        summary: The plan buffer views that hold the parameter across steps. One view is the in-place case, the step reading version n and the update writing n + 1 into it; two are ping-pong, step s reading view s mod 2 and writing view (s + 1) mod 2 (DESIGN.md § 6.3 item 3). M1 emits one.
    invariants:
      - param >= 0
      - canonical_parameter_id >= 0
      - canonical_parameter_id <= 18446744073709551615
      - views.count >= 1
      - views.count <= 2

  - name: modelspec.artifact.DataRole
    kind: enum
    naming:
      summary: Whether a bound tensor is a training input or a target (DESIGN.md § 2 `input`, `target`).
    variants: [Input, Target]

  - name: modelspec.artifact.DataSpec
    kind: struct
    naming:
      summary: One input or target tensor of the train specification, with the shape a batch must have (DESIGN.md § 2, § 6.1 tensor shapes).
    fields:
      - name: name
        type: String
      - name: role
        type: modelspec.artifact.DataRole
      - name: dtype
        type: modelspec.checkpoint.DType
      - name: shape
        type: modelspec.checkpoint.Shape
      - name: view
        type: modelspec.artifact.BufferView
        summary: The plan buffer view a runner writes each batch of this tensor into before a step (DESIGN.md § 7.1). No plan step loads a batch; the runner uploads it between recordings, outside the recorded plan, ordered after the fence of the recording before and before the first step of the next.

  - name: modelspec.artifact.BufferView
    kind: struct
    naming:
      summary: A typed view of a plan buffer (DESIGN.md § 7.1). size_bytes equals element_count times dtype.size_bytes and offset is a multiple of alignment; ESS states neither here. Device ownership (§ 7.1) is not yet typed.
    fields:
      - name: buffer
        type: Integer
        summary: The plan-local number of the allocation the view lies in (DESIGN.md § 3.1 resources).
      - name: dtype
        type: modelspec.checkpoint.DType
      - name: element_count
        type: Integer
        summary: Logical element count (DESIGN.md § 7.1).
      - name: offset
        type: Integer
        summary: Start of the allocation range, in bytes (DESIGN.md § 7.1).
      - name: size_bytes
        type: Integer
        summary: Length of the allocation range, in bytes (DESIGN.md § 7.1).
      - name: alignment
        type: Integer
        summary: Alignment of the view, in bytes (DESIGN.md § 7.1).
    invariants:
      - buffer >= 0
      - element_count > 0
      - offset >= 0
      - size_bytes > 0
      - size_bytes >= dtype.size_bytes
      - alignment > 0

  - name: modelspec.artifact.PlanOp
    kind: enum
    naming:
      summary: The command kinds of the execution DAG (DESIGN.md § 3.1).
    variants: [Allocate, Copy, Dispatch, Barrier, Complete]

  - name: modelspec.artifact.PlanStep
    kind: struct
    naming:
      summary: One command of the execution DAG (DESIGN.md § 3.1). A Dispatch names the kernel module it runs, one of its artifact's kernels (DESIGN.md § 7.1); ESS cannot state that the module belongs to the same artifact.
    fields:
      - name: op
        type: modelspec.artifact.PlanOp
      - name: kernel_module_id
        type: Optional<modelspec.artifact.KernelModuleId>
        summary: Present exactly on a Dispatch step (DESIGN.md § 7.1).
      - name: workgroups
        type: Optional<modelspec.device.Extent3D>
        summary: Dispatch dimensions, the workgroup count per dimension; present exactly on a Dispatch step (DESIGN.md § 3.1).
      - name: reads
        type: List<modelspec.artifact.BufferView>
        summary: The resources the step reads, such as a Copy's source (DESIGN.md § 3.1 resource dependencies).
      - name: writes
        type: List<modelspec.artifact.BufferView>
        summary: The resources the step writes; for an Allocate step the scratch allocation it makes (DESIGN.md § 3.1 scratch allocations).
      - name: depends_on
        type: List<Integer>
        summary: Positions in the plan of earlier steps this one waits on, the DAG's dependencies and barriers (DESIGN.md § 3.1). That each lies before this step is not stated in ESS. A Barrier with no dependencies is a fence, ordered after every earlier step; a step with no dependencies after a fence is ordered after that fence.
      - name: value
        type: Optional<Integer>
        summary: The Tensor IR value a Dispatch, Copy or Allocate step computes or holds (DESIGN.md § 3.1); absent on a Barrier.
    invariants:
      - forall: {in: depends_on, as: position, that: position >= 0}
      - any:
          - not defined(value)
          - value >= 0
      - distinct: {in: depends_on, as: position}
      - any:
          - all: [op == Dispatch, defined(kernel_module_id), defined(workgroups)]
          - all: [op != Dispatch, not defined(kernel_module_id), not defined(workgroups)]

  - name: modelspec.artifact.KernelCacheKey
    kind: struct
    naming:
      summary: The key a kernel configuration is cached under (DESIGN.md § 5.3).
    fields:
      - name: ir_hash
        type: modelspec.artifact.ContentHash
        summary: Hash of the kernel's IR (DESIGN.md § 5.3).
      - name: shapes
        type: List<modelspec.checkpoint.Shape>
        summary: The shapes the kernel was specialized for (DESIGN.md § 5.3).
      - name: dtype
        type: modelspec.checkpoint.DType
      - name: fast_math
        type: Boolean
        summary: Optimization setting (DESIGN.md § 3.3, § 5.3).
      - name: deterministic
        type: Boolean
        summary: Optimization setting (DESIGN.md § 3.3, § 5.3).
      - name: vendor_id
        type: Integer
        summary: GPU vendor identifier, as DeviceProfile.vendor_id (DESIGN.md § 5.3).
      - name: device_id
        type: Integer
        summary: GPU device identifier, as DeviceProfile.device_id (DESIGN.md § 5.3).
      - name: driver_version
        type: Integer
        summary: Driver identifier, as DeviceProfile.driver_version (DESIGN.md § 5.3).
      - name: capabilities
        type: List<String>
        summary: The Vulkan extensions and SPIR-V capabilities the kernel uses, by name (DESIGN.md § 5.3 extension/capability set).
    invariants:
      - distinct: {in: capabilities, as: capability}

entities:
  - name: modelspec.artifact.CompiledArtifact
    naming:
      summary: A versioned compiler output holding a manifest, kernels and an execution plan (DESIGN.md § 7.1). A Cpu artifact has no kernels and no Dispatch steps (DESIGN.md § 7.1); ESS states the plan half here, not the kernels half.
    identity:
      name: artifact_id
      type: modelspec.artifact.ArtifactId
    fields:
      - name: format_version
        type: Integer
        summary: CompiledArtifact is versioned (DESIGN.md § 7.1).
      - name: backend
        type: modelspec.artifact.Backend
      - name: artifact_hash
        type: modelspec.artifact.ContentHash
        summary: blake3 of the serialized artifact; it covers fast_math and deterministic (DESIGN.md § 3.3, § 7).
      - name: source_hash
        type: modelspec.artifact.ContentHash
        summary: Hash of the `.mspec` source compiled; the source version (DESIGN.md § 6.1).
      - name: ir_hash
        type: modelspec.artifact.ContentHash
        summary: Part of every kernel cache key (DESIGN.md § 5.3).
      - name: fast_math
        type: Boolean
        summary: Recorded in the artifact hash (DESIGN.md § 3.3).
      - name: deterministic
        type: Boolean
        summary: A compile setting; every floating-point reduction runs in an order fixed by the shape alone, workgroup sizes are fixed in the plan at compile time (no shipped command reads them from a DeviceProfile, and no reduction's workgroup size depends on one), and the CPU order is one admissible order, so it is recorded in the artifact hash (DESIGN.md § 3.3, § 5.2, § 6.1).
      - name: compiler_version
        type: String
        summary: Manifest; recorded for reproducibility (DESIGN.md § 6.1).
      - name: schema_hash
        type: modelspec.artifact.ContentHash
        summary: Manifest; the compiler/model schema hash a checkpoint is matched against (DESIGN.md § 6.2).
      - name: parameters
        type: List<modelspec.artifact.ParameterSpec>
        summary: Manifest; parameter paths, dtypes and shapes, matched against a checkpoint's (DESIGN.md § 6.2); paths are unique and no two parameters alias (DESIGN.md § 2.3).
      - name: data
        type: List<modelspec.artifact.DataSpec>
        summary: Manifest; the input and target tensors and their shapes (DESIGN.md § 2, § 6.1).
      - name: plan
        type: List<modelspec.artifact.PlanStep>
        summary: The execution DAG of one training step in a valid execution order (DESIGN.md § 3.1, § 7.1). It has no Complete step and exactly one fence, a Barrier with no dependencies, which is its last step. A runner may record it many times back to back into one command buffer, the recordings concatenated and each ordered after the fence of the one before, and the concatenation verifies as one plan in which each fence closes a recording. The runner places a CPU-visible completion point at the end of a run and at each requested checkpoint. Within one recording no step reads a parameter after its update. Its Allocate steps are run setup, executed once before the first recording.
      - name: forward_plan
        type: List<modelspec.artifact.PlanStep>
        summary: The inference plan, the forward pass without loss, gradients or update, what the data loader runs (DESIGN.md § 7.1). It writes no parameter view, has no Complete step and has exactly one fence, its last step, as the step plan does.
      - name: buffers
        type: List<Integer>
        summary: The size in bytes of each plan buffer, indexed by BufferView.buffer; both plans and every bound view share them (DESIGN.md § 3.1 resources, § 7.1). In M1 each stored value has its own buffer, with five exceptions. An SGD update writes its parameter's buffer in place, a compile-time scalar folded into its readers' immediates has no buffer, the lr * g product of an update fused into one sgd_update kernel has no buffer, a matmul pre-activation that no op but its ReLU epilogue reads, and that is not the loss or the prediction, has no buffer, and a transpose that no op but matmuls reads, that is not the loss or the prediction, and whose operand is not a parameter updated before one of those matmuls, has no buffer, each matmul reading its operand in place (DESIGN.md § 3.1); no data, loss or prediction view lies in a parameter buffer. No buffer exceeds 4294967295 bytes, the u32 range of a storage buffer binding.
      - name: loss_view
        type: modelspec.artifact.BufferView
        summary: The plan buffer view the step plan writes the rank-0 loss into, one element (DESIGN.md § 7.1). Buffer numbers are shared by both plans and laid out for every backend; a Cpu artifact has the views and empty plans.
      - name: prediction_view
        type: modelspec.artifact.BufferView
        summary: The plan buffer view the forward plan and the step plan write the model's prediction into (DESIGN.md § 7.1). A forward that returns an input or a parameter copies it into this view, and one that returns a literal fills it.
    invariants:
      - forall: {in: buffers, as: size, that: size > 0}
      - loss_view.buffer < buffers.count
      - loss_view.element_count == 1
      - prediction_view.buffer < buffers.count
      - forall: {in: data, as: binding, that: binding.view.buffer < buffers.count}
      - forall: {in: parameters, as: parameter, that: {forall: {in: parameter.views, as: view, that: view.buffer < buffers.count}}}
      - distinct: {in: parameters, as: parameter, by: parameter.path}
      - distinct: {in: parameters, as: parameter, by: parameter.canonical_parameter_id}
      - distinct: {in: data, as: binding, by: binding.name}
      - forall: {in: plan, as: step, that: {forall: {in: step.depends_on, as: position, that: position < plan.count}}}
      - forall: {in: forward_plan, as: step, that: {forall: {in: step.depends_on, as: position, that: position < forward_plan.count}}}
      - forall: {in: plan, as: step, that: step.op != Complete}
      - forall: {in: forward_plan, as: step, that: step.op != Complete}
      - any:
          - backend == Vulkan
          - forall: {in: plan, as: step, that: step.op != Dispatch}
      - any:
          - backend == Vulkan
          - forall: {in: forward_plan, as: step, that: step.op != Dispatch}
    relations:
      - name: kernels
        kind: owns
        target: modelspec.artifact.KernelModule
        cardinality: many
        via: artifact_id
    lifecycle:
      initial: Compiled
      states: [Compiled]
      terminal: [Compiled]

  - name: modelspec.artifact.KernelModule
    naming:
      summary: One generated SPIR-V module of a Vulkan artifact (DESIGN.md § 3, target lowering; § 7.1).
    identity:
      name: kernel_module_id
      type: modelspec.artifact.KernelModuleId
    fields:
      - name: artifact_id
        type: modelspec.artifact.ArtifactId
      - name: entry_point
        type: String
      - name: spirv
        type: Bytes
      - name: cache_key
        type: modelspec.artifact.KernelCacheKey
        summary: The configuration cache key this module was built under (DESIGN.md § 5.3).
    lifecycle:
      initial: Emitted
      states: [Emitted]
      terminal: [Emitted]
