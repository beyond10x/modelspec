domain: modelspec.observatory

summary: What the training observatory reads from a training run, the architecture it draws and the insights it shows (epic:training-observatory). The event stream of a run is its RunEvents in sequence order, served live as `text/event-stream` (ServeAddress, StreamFrame) or replayed from a recorded run file.

types:
  - name: modelspec.observatory.RecordedRunFile
    kind: newtype
    of: String
    naming:
      summary: The path of a recorded run file, the file a stream replays from (epic:training-observatory, In scope, first bullet; wave m1-g coordinator, 2026-10-23). The file is JSON Lines, one RunEvent per line in sequence order from 0, each line the JSON of a StreamFrame's `data:` and ending in a newline, all of one training_run_id, the last RunFinished or RunFailed. `modelspec train <file> --record <path>`, with or without `--serve`, creates the file before the run starts and writes each event to it as the run emits it, before a client of `--serve` reads it. `modelspec observe <path> [--serve <addr>]` replays it as the live stream is served (ServeAddress, StreamFrame), the same frames with the same `id:` lines, all of them at once, at port 0 of 127.0.0.1 without `--serve`, until SIGINT, SIGTERM or SIGHUP, and then exits 0. Before serving, `observe` refuses with one line on stderr and exit 1 a file that cannot be read, a line that is not a whole RunEvent (a truncated file), a sequence that skips or repeats a number, two training_run_id values, a first event that is not RunStarted, an event after RunFinished or RunFailed, or a last event that is not RunFinished or RunFailed. training_run_id and run_event_id differ per invocation, and the events carry no timestamp; a recording compared with another run's events is compared without those two fields.


  - name: modelspec.observatory.RunEventId
    kind: newtype
    of: Uuid

  - name: modelspec.observatory.MetricSample
    kind: struct
    naming:
      summary: One named metric value at a step, such as MLM accuracy (epic:training-observatory live metric charts, epic:bert-from-scratch evaluation).
    fields:
      - name: name
        type: String
      - name: value
        type: Optional<Binary64>
        presence: null_when_absent
        summary: The metric's value; null when it is NaN or ±inf, which Binary64 does not hold (wave observatory-1 coordinator, 2026-10-21).

  - name: modelspec.observatory.Histogram
    kind: struct
    naming:
      summary: The distribution of one tensor's elements in bins; bin i counts the elements in [bin_edges[i], bin_edges[i+1]), so there is one more edge than counts, which ESS does not state here.
    # UNMAPPED: the bin count and how the edges are chosen (fixed, per step, per tensor) are not
    # settled by the epic. Open question.
    fields:
      - name: bin_edges
        type: List<Optional<Binary64>>
        summary: The bin edges in ascending order; an edge is null when it is NaN or ±inf, which Binary64 does not hold (wave observatory-1 coordinator, 2026-10-21).
      - name: counts
        type: List<Integer>
    invariants:
      - forall: {in: counts, as: count, that: count >= 0}

  - name: modelspec.observatory.StatisticsSubject
    kind: enum
    naming:
      summary: Whether statistics describe a parameter's values or the gradient of the loss with respect to it (epic:training-observatory parameter/gradient histograms and norms).
    variants: [Value, Gradient]

  - name: modelspec.observatory.ParameterStatistics
    kind: struct
    naming:
      summary: The norm and histogram of one parameter's values or gradient at a step, by its stable path (DESIGN.md § 2.3; epic:training-observatory).
    fields:
      - name: path
        type: modelspec.checkpoint.ParameterPath
      - name: subject
        type: modelspec.observatory.StatisticsSubject
      - name: norm
        type: Optional<Binary64>
        presence: null_when_absent
        summary: The norm; null when it is NaN or ±inf, which Binary64 does not hold (wave observatory-1 coordinator, 2026-10-21).
        # UNMAPPED: the epic says "norms" and not which norm (L2, max). Open question.
      - name: histogram
        type: modelspec.observatory.Histogram
    invariants:
      - any:
          - not defined(norm)
          - norm >= 0

  - name: modelspec.observatory.StepCompleted
    kind: struct
    naming:
      summary: The event of one completed training step (epic:training-observatory), one for each of the steps + 1 losses a run records, steps start_step through start_step + steps in order; step k is the loss after k updates and the last is the loss of the final parameters (DESIGN.md § 8, the `step <k> loss <v>` lines; `train::runner` in modelspec-runtime). Its loss is the loss the CLI prints for that step (DESIGN.md § 8).
    fields:
      - name: step
        type: Integer
        summary: The step number the run reached, as TrainingRun.current_step (DESIGN.md § 6.1 step number).
      - name: loss
        type: Optional<Binary64>
        presence: null_when_absent
        summary: The rank-0 loss value of the step (DESIGN.md § 2.2, § 8); null when the loss is NaN or ±inf, which Binary64 does not hold, as a diverging run records (wave observatory-1 coordinator, 2026-10-21). The CLI prints a `step <k> loss <v>` line on stdout only for step 0, every 50th step and the last step; for a printed step whose loss is null that line names which, `NaN`, `inf` or `-inf`, and for any other step nothing names it (wave observatory-1 coordinator, 2026-10-22).
      - name: metrics
        type: List<modelspec.observatory.MetricSample>
        summary: Metric samples of the step besides the loss; names are unique.
      - name: parameters
        type: List<modelspec.observatory.ParameterStatistics>
        summary: Value and gradient statistics per parameter; the pair (path, subject) is unique, which ESS does not state here. A parameter the loss does not read has no gradient (DESIGN.md § 3.3 step 4).
        # UNMAPPED: whether every step carries statistics or only sampled steps (the list then
        # empty) is not settled by the epic. Open question.
    # UNMAPPED: the epic shows activation statistics per step but does not say what they are keyed by
    # (a Tensor IR value, a layer, a parameter path) or what they hold; not typed. Open question.
    invariants:
      - step >= 0
      - distinct: {in: metrics, as: sample, by: sample.name}

  - name: modelspec.observatory.RunEventBody
    kind: union
    tag: kind
    naming:
      summary: The typed event the training process sends, one per step and one per run lifecycle change (epic:training-observatory). A run is started, then finished or failed, and its stream says so, RunStarted first, then one StepCompleted per recorded loss, then exactly one of RunFinished or RunFailed, last. These are not TrainingRun lifecycle states, which keep the one state Recorded of the record, because ESS moves an entity's state only by a command outcome (ESS-ENTITY-005), and this specification declares no commands. RunFinished carries nothing; the final loss is the last StepCompleted's. A run refused before its first step, such as by E-DATA-003, sends RunStarted then RunFailed and no StepCompleted.
    variants:
      RunStarted: modelspec.observatory.RunStarted
      StepCompleted: modelspec.observatory.StepCompleted
      RunFinished:
      RunFailed: modelspec.observatory.RunFailed

  - name: modelspec.observatory.RunStarted
    kind: struct
    naming:
      summary: The event of a run starting, the first of its stream (RunEventBody). It carries the two TrainingRun fields that say which steps follow, start_step through start_step + steps (DESIGN.md § 6); the other record fields are the run's artifact and record, which M0 does not write (story:m0-cpu-sgd-training, Out of scope).
    fields:
      - name: steps
        type: Integer
        summary: TrainingRun.steps, the steps of this invocation.
      - name: start_step
        type: Integer
        summary: TrainingRun.start_step, the step of the first StepCompleted.
    invariants:
      - steps >= 0
      - start_step >= 0

  - name: modelspec.observatory.RunFailed
    kind: struct
    naming:
      summary: The event of a run failing, the last of its stream (RunEventBody). A failure is a diagnostic or a runtime error (DESIGN.md § 8.1, diagnostics distinguish user specification errors from runtime failures).
    fields:
      - name: code
        type: Optional<String>
        summary: The diagnostic code that refused the run, such as E-DATA-003 (DESIGN.md § 8.1, M0 codes for `train`); absent for a runtime error, which has no code.
      - name: message
        type: String
        summary: The failure on one line, the diagnostic's message or the runtime error as `modelspec train` reports it.

  - name: modelspec.observatory.ServeAddress
    kind: newtype
    of: String
    naming:
      summary: The value of `modelspec train --serve <addr>` (epic:training-observatory, In scope, first bullet), a loopback socket address `<ip>:<port>` with an IPv4 address in 127.0.0.0/8, `[::1]` or `localhost` (127.0.0.1), so the stream is reachable from this machine only (epic, Out of scope, no remote access beyond localhost). Port 0 lets the system choose. Any other address is a usage error. Once bound the process prints `serving http://<bound address>/events` on stderr; stdout is what a run without the flag prints.

  - name: modelspec.observatory.RunEventKind
    kind: enum
    naming:
      summary: The SSE `event:` name of a StreamFrame, the `kind` tag of its RunEvent's body (RunEventBody).
    variants: [RunStarted, StepCompleted, RunFinished, RunFailed]

  - name: modelspec.observatory.StreamFrame
    kind: struct
    naming:
      summary: One Server-Sent Events frame of the live stream (epic:training-observatory, In scope, first bullet; wave observatory-1 coordinator, 2026-10-21), the lines `event:`, `id:` and `data:` and a blank line. `GET /events` at the ServeAddress answers 200 with `Content-Type text/event-stream` and sends the run's events in sequence order from sequence 0, or from the one after a `Last-Event-ID` request header, then each new event as the run emits it, and closes the response after RunFinished or RunFailed; any other path answers 404. The process keeps serving after the run ends, so a client that connects late reads the whole stream; on SIGINT, SIGTERM or SIGHUP after the run ends it stops serving and exits with the run's own status, 0 for a run that finished and 1 for a run that failed, the code `modelspec train` gives without the flag (wave observatory-1 coordinator, 2026-10-21); a signal before the run ends stops the process as it stops a run without the flag. The run has ended once it has printed its last stdout line, or for a run that fails its failure on stderr, which come before RunFinished and RunFailed, so a signal sent after any of them gets the run's status (wave observatory-1 coordinator, 2026-10-22).
    fields:
      - name: event
        type: modelspec.observatory.RunEventKind
      - name: id
        type: Integer
        summary: The RunEvent's sequence.
      - name: data
        type: String
        summary: The JSON of one RunEvent on one line, valid against the JSON Schema `ess generate --kind schema` writes for it.
    invariants:
      - id >= 0

  - name: modelspec.observatory.ModelGraphId
    kind: newtype
    of: Uuid

  - name: modelspec.observatory.IrStage
    kind: enum
    naming:
      summary: The IR level a graph is drawn from, as `modelspec ir --stage tensor|training` prints it (DESIGN.md § 3.1, § 8).
    variants: [Tensor, Training]

  - name: modelspec.observatory.TensorOperator
    kind: enum
    naming:
      summary: The Tensor IR operations, ReluGrad and BroadcastScalar being internal gradient ops (DESIGN.md § 3.1, § 4; `TensorOp` in `modelspec-core/src/ir/tensor.rs`). The operators of epic:bert-from-scratch join as the compiler gains them.
    variants: [Input, ParamRead, Scalar, Add, Sub, Mul, MatMul, Relu, Transpose, ReduceSum, ReduceMean, Mse, ReluGrad, BroadcastScalar]

  - name: modelspec.observatory.Subgraph
    kind: enum
    naming:
      summary: The Training IR subgraph of a node; Gradient is the backward computation (DESIGN.md § 3.1; `Subgraph` in `modelspec-core/src/ir/training.rs`).
    variants: [Forward, Loss, Gradient, Optimizer]

  - name: modelspec.observatory.GraphNode
    kind: struct
    naming:
      summary: One operator of the graph and the tensor it defines, with its dtype and shape (DESIGN.md § 3.1, every tensor value has a shape, dtype and defining operation).
    fields:
      - name: value_id
        type: Integer
        summary: The SSA value the node defines, as Tensor IR prints it (DESIGN.md § 3.2 ValueId).
      - name: op
        type: modelspec.observatory.TensorOperator
      - name: dtype
        type: modelspec.checkpoint.DType
      - name: shape
        type: modelspec.checkpoint.Shape
      - name: subgraph
        type: Optional<modelspec.observatory.Subgraph>
        summary: Present exactly on a node of a Training-stage graph, so forward and backward are told apart (epic:training-observatory).
    invariants:
      - value_id >= 0

  - name: modelspec.observatory.GraphEdge
    kind: struct
    naming:
      summary: One tensor flowing from the node that defines it to a node that reads it; its dtype and shape are its producer's (DESIGN.md § 3.2 TensorNode.operands).
    fields:
      - name: producer
        type: Integer
        summary: value_id of the node defining the tensor.
      - name: consumer
        type: Integer
        summary: value_id of the node reading it.
      - name: operand
        type: Integer
        summary: The position of the tensor among the consumer's operands, from 0; operand order matters (Sub, MatMul).
    invariants:
      - producer >= 0
      - consumer >= 0
      - operand >= 0

  - name: modelspec.observatory.InsightId
    kind: newtype
    of: Uuid

  - name: modelspec.observatory.InsightMethod
    kind: enum
    naming:
      summary: The explainability method an insight was computed with; gradient times input saliency first, since the compiler already derives gradients (epic:training-observatory).
    variants: [GradientTimesInput]

entities:
  - name: modelspec.observatory.Insight
    naming:
      summary: One explainability result for a selected input at a step of a run, such as gradient times input saliency (epic:training-observatory). Its values match a finite-difference check within 1e-2 (epic acceptance).
    # UNMAPPED: what a "selected input" is (one row of the batch, a whole input tensor, a value the
    # operator supplies) and how it is selected is not settled by the epic; only the input binding's
    # name is typed. Open question.
    identity:
      name: insight_id
      type: modelspec.observatory.InsightId
    fields:
      - name: training_run_id
        type: modelspec.training.TrainingRunId
      # UNMAPPED: an insight is "per step" of a run, but nothing says whether the run owns it or it
      # stands on its own (references), or whether it is taken against the run or against a
      # checkpoint of it. No relation entry is declared, so validate warns ESS-ENTITY-019 here.
      # Open question for the owner.
      - name: step
        type: Integer
        summary: The step whose parameters the insight was computed with (DESIGN.md § 6.1 step number).
      - name: method
        type: modelspec.observatory.InsightMethod
      - name: input_name
        type: String
        summary: The name of the input binding the insight attributes to, a DataSpec.name of the run's artifact with role Input (DESIGN.md § 2).
      - name: shape
        type: modelspec.checkpoint.Shape
        summary: The shape of the attribution, the selected input's.
      - name: values
        type: List<Binary64>
        summary: The attribution per element of the selected input, in row-major order (DESIGN.md § 2.3); as many as the elements of shape, which ESS does not state here.
    invariants:
      - step >= 0
    lifecycle:
      initial: Computed
      states: [Computed]
      terminal: [Computed]

  - name: modelspec.observatory.ModelGraph
    naming:
      summary: The architecture view of one compiled program, derived from its verified IR (epic:training-observatory). Every edge's producer and consumer is a node of the same graph, which ESS does not state here.
    identity:
      name: model_graph_id
      type: modelspec.observatory.ModelGraphId
    fields:
      - name: artifact_id
        type: modelspec.artifact.ArtifactId
        summary: The compiled artifact whose IR (artifact ir_hash) the graph is drawn from; a run's graph is its artifact's (TrainingRun.artifact_id).
      # UNMAPPED: a graph is derived from one artifact's IR, but nothing says whether it is the
      # artifact's (owns, from CompiledArtifact) or stands on its own (references), nor whether an
      # artifact has one graph per IrStage. No relation entry is declared, so validate warns
      # ESS-ENTITY-019 here. Open question for the owner.
      - name: stage
        type: modelspec.observatory.IrStage
      - name: nodes
        type: List<modelspec.observatory.GraphNode>
      - name: edges
        type: List<modelspec.observatory.GraphEdge>
    invariants:
      - distinct: {in: nodes, as: node, by: node.value_id}
      - any:
          - all:
              - stage == Training
              - forall: {in: nodes, as: node, that: defined(node.subgraph)}
          - all:
              - stage == Tensor
              - forall: {in: nodes, as: node, that: not defined(node.subgraph)}
    lifecycle:
      initial: Derived
      states: [Derived]
      terminal: [Derived]

  - name: modelspec.observatory.RunEvent
    naming:
      summary: One event of a training run's stream, at its position in the stream. Sequence numbers are unique among the events of one run, which ESS does not state across entities here.
    identity:
      name: run_event_id
      type: modelspec.observatory.RunEventId
    fields:
      - name: training_run_id
        type: modelspec.training.TrainingRunId
      - name: sequence
        type: Integer
        summary: Position of the event in its run's stream, from 0; a replay sends events in this order (epic:training-observatory, replayable from a recorded run file).
      - name: body
        type: modelspec.observatory.RunEventBody
    invariants:
      - sequence >= 0
    lifecycle:
      initial: Emitted
      states: [Emitted]
      terminal: [Emitted]
