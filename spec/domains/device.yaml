domain: modelspec.device

summary: What `modelspec inspect-device` reports; queried from the driver, never inferred from a product name (DESIGN.md § 5.1, § 8).

types:
  - name: modelspec.device.DeviceProfileId
    kind: newtype
    of: Uuid

  - name: modelspec.device.Extent3D
    kind: struct
    naming:
      summary: A size along the three workgroup dimensions x, y and z, each positive (DESIGN.md § 3.1 dispatch dimensions, § 5.1 workgroup limits).
    fields:
      - name: x
        type: Integer
      - name: y
        type: Integer
      - name: z
        type: Integer
    invariants:
      - x > 0
      - y > 0
      - z > 0

  - name: modelspec.device.MemoryHeap
    kind: struct
    naming:
      summary: One Vulkan memory heap and its budget (DESIGN.md § 5.1 memory heaps/budgets).
    fields:
      - name: size_bytes
        type: Integer
      - name: device_local
        type: Boolean
      - name: budget_bytes
        type: Optional<Integer>
        summary: VkPhysicalDeviceMemoryBudgetPropertiesEXT.heapBudget; absent where the driver does not expose VK_EXT_memory_budget (DESIGN.md § 0 invariant 6, § 5.1).
    invariants:
      - size_bytes > 0
      - any:
          - not defined(budget_bytes)
          - budget_bytes <= size_bytes

  - name: modelspec.device.CooperativeMatrixShape
    kind: struct
    naming:
      summary: One VkCooperativeMatrixPropertiesKHR entry, component types by Vulkan enum name (DESIGN.md § 5.1).
    fields:
      - name: m
        type: Integer
      - name: n
        type: Integer
      - name: k
        type: Integer
      - name: a_type
        type: String
      - name: b_type
        type: String
      - name: c_type
        type: String
      - name: result_type
        type: String

entities:
  - name: modelspec.device.DeviceProfile
    naming:
      summary: One Vulkan physical device as discovery recorded it (DESIGN.md § 5.1).
    identity:
      name: device_profile_id
      type: modelspec.device.DeviceProfileId
    fields:
      - name: vendor_id
        type: Integer
      - name: device_id
        type: Integer
      - name: device_uuid
        type: Optional<String>
        summary: Recorded if available (DESIGN.md § 5.1).
      - name: driver_version
        type: Integer
      - name: subgroup_size
        type: Optional<Integer>
        summary: VkPhysicalDeviceSubgroupProperties.subgroupSize; absent where the driver does not state it (a device below Vulkan 1.1) (DESIGN.md § 5.1 subgroup properties).
      - name: subgroup_stages
        type: List<String>
        summary: VkPhysicalDeviceSubgroupProperties.supportedStages, by VkShaderStageFlagBits name; empty where `subgroup_size` is absent (DESIGN.md § 5.1 subgroup properties).
      - name: subgroup_operations
        type: List<String>
        summary: VkPhysicalDeviceSubgroupProperties.supportedOperations, by VkSubgroupFeatureFlagBits name; empty where `subgroup_size` is absent (DESIGN.md § 5.1 subgroup properties).
      - name: max_workgroup_invocations
        type: Integer
      - name: max_workgroup_size
        type: modelspec.device.Extent3D
        summary: VkPhysicalDeviceLimits.maxComputeWorkGroupSize, per dimension (DESIGN.md § 5.1 workgroup limits).
      - name: max_workgroup_count
        type: modelspec.device.Extent3D
        summary: VkPhysicalDeviceLimits.maxComputeWorkGroupCount, per dimension (DESIGN.md § 5.1 workgroup limits).
      - name: max_shared_memory_bytes
        type: Integer
        summary: VkPhysicalDeviceLimits.maxComputeSharedMemorySize; tile sizes must fit it (DESIGN.md § 5.1, § 5.2).
      - name: f16_storage
        type: Optional<Boolean>
        summary: VkPhysicalDevice16BitStorageFeatures.storageBuffer16BitAccess; absent where the driver does not state it (a device below Vulkan 1.1) (DESIGN.md § 5.1).
      - name: f16_compute
        type: Optional<Boolean>
        summary: Whether shaders may do f16 arithmetic (VkPhysicalDeviceShaderFloat16Int8Features.shaderFloat16); absent where the driver does not state it (a device below Vulkan 1.2); without it there is no f16 compute path (DESIGN.md § 5.1, § 8.1 E-TARGET-034).
      - name: cooperative_matrix
        type: Boolean
        summary: Whether the driver exposes a cooperative-matrix extension (DESIGN.md § 5.2, M4).
      - name: timestamp_queries
        type: Boolean
      - name: memory_heaps
        type: List<modelspec.device.MemoryHeap>
      - name: vulkan_api_version
        type: Integer
        summary: VkPhysicalDeviceProperties.apiVersion, packed as Vulkan packs it (DESIGN.md § 5.1).
      - name: spirv_version
        type: Integer
        summary: Highest SPIR-V version the device accepts, packed as in the SPIR-V header (DESIGN.md § 5.1).
      - name: max_storage_buffer_range
        type: Integer
        summary: VkPhysicalDeviceLimits.maxStorageBufferRange (DESIGN.md § 5.1).
      - name: min_storage_buffer_offset_alignment
        type: Integer
        summary: VkPhysicalDeviceLimits.minStorageBufferOffsetAlignment (DESIGN.md § 5.1).
      - name: cooperative_matrix_shapes
        type: List<modelspec.device.CooperativeMatrixShape>
        summary: The actual supported matrix types and M/N/K shapes; empty when `cooperative_matrix` is false (DESIGN.md § 5.2).
      - name: shader_rounding_mode_rte_f32
        type: Optional<Boolean>
        summary: The driver value of VkPhysicalDeviceFloatControlsProperties.shaderRoundingModeRTEFloat32; absent where the driver does not state it (a device below Vulkan 1.2) (DESIGN.md § 5.4).
      - name: shader_denorm_preserve_f32
        type: Optional<Boolean>
        summary: The driver value of VkPhysicalDeviceFloatControlsProperties.shaderDenormPreserveFloat32; absent where the driver does not state it (a device below Vulkan 1.2) (DESIGN.md § 5.4).
      - name: shader_signed_zero_inf_nan_preserve_f32
        type: Optional<Boolean>
        summary: The driver value of VkPhysicalDeviceFloatControlsProperties.shaderSignedZeroInfNanPreserveFloat32; absent where the driver does not state it (a device below Vulkan 1.2) (DESIGN.md § 5.4).
    invariants:
      - any:
          - not defined(subgroup_size)
          - subgroup_size > 0
      - max_workgroup_invocations > 0
      - max_shared_memory_bytes > 0
      - distinct: {in: subgroup_stages, as: stage}
      - distinct: {in: subgroup_operations, as: operation}
      - any:
          - cooperative_matrix == true
          - cooperative_matrix_shapes.count == 0
    lifecycle:
      initial: Probed
      states: [Probed]
      terminal: [Probed]
