[workspace]
members = ["crates/modelspec-core", "crates/modelspec-runtime", "crates/modelspec-observatory", "crates/modelspec-cli", "crates/modelspec-docs"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
modelspec-core = { path = "crates/modelspec-core", version = "0.6.0" }
modelspec-runtime = { path = "crates/modelspec-runtime", version = "0.6.0" }
modelspec-observatory = { path = "crates/modelspec-observatory", version = "0.6.0" }
modelspec-cli = { path = "crates/modelspec-cli", version = "0.6.0" }
logos = "0.16"
thiserror = "2.0"
blake3 = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
jsonschema = { version = "0.58", default-features = false }
ctrlc = { version = "3.5", features = ["termination"] }
nix = { version = "0.31", default-features = false, features = ["signal"] }
ash = { version = "0.38", default-features = false, features = ["loaded"] }
rspirv = "0.13"
ts-rs = { version = "12", features = ["uuid-impl", "no-serde-warnings"] }
headless_chrome = "1.0.22"
