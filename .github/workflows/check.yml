name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: modelspec / task ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch main for the UI ratchet
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Install go-task
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install ess
        env:
          ESS_PINNED: "0.74.0"
          ESS_SHA256: 072d033d74d3cc1649aa9a5ef82a4e07637c3078a2f2ee3dc14ad2e6a80da863
        run: |
          set -euo pipefail
          ESS_VERSION=$(sed -n 's/^requires: ess //p' spec/ess-inputs.yaml)
          if [ "$ESS_VERSION" != "$ESS_PINNED" ]; then
            echo "spec/ess-inputs.yaml requires ess '$ESS_VERSION'; the checksum here is for $ESS_PINNED" >&2
            exit 1
          fi
          ESS_DIR="ess-$ESS_VERSION-x86_64-unknown-linux-gnu"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$ESS_DIR.tar.gz" \
            "https://github.com/beyond10x/ess/releases/download/$ESS_VERSION/$ESS_DIR.tar.gz"
          echo "$ESS_SHA256  $RUNNER_TEMP/$ESS_DIR.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$ESS_DIR.tar.gz" -C "$RUNNER_TEMP" "$ESS_DIR/ess"
          echo "$RUNNER_TEMP/$ESS_DIR" >> "$GITHUB_PATH"

      - name: Install Vulkan headers and spirv-val
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvulkan-dev spirv-tools fonts-dejavu-core

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
          cache: true
          cache_dependency_path: ui/pnpm-lock.yaml

      - name: Find Chrome for the browser tests
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome)
          "$chrome" --version
          echo "CHROME=$chrome" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: task ci
        run: task ci
