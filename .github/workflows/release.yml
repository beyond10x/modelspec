name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: release / verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install go-task
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: The tag is the workspace version and CHANGELOG.md has its entry
        env:
          TAG: ${{ github.ref_name }}
        run: task release-check TAG="$TAG"

  check:
    name: release / check
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  publish:
    name: release / publish
    needs: [verify, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      ASSET: modelspec-${{ github.ref_name }}-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable

      - name: Build the modelspec binary
        run: cargo build --locked --release -p modelspec-cli --bin modelspec

      - name: Package the binary and its checksum
        run: |
          set -euo pipefail
          mkdir dist
          cp target/release/modelspec "dist/$ASSET"
          test "$("dist/$ASSET" --version)" = "modelspec $TAG"
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256" && sha256sum --check --strict "$ASSET.sha256")

      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          awk -v head="## [$TAG] - " 'index($0, head) == 1 { found = 1; next } found && (/^## / || /^\[[^]]+\]: /) { exit } found { print }' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md
          printf '\nFull entry: https://github.com/%s/blob/%s/CHANGELOG.md\n' "$GITHUB_REPOSITORY" "$TAG" >> notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" --clobber
          else
            gh release create "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" --title "$TAG" --notes-file notes.md --verify-tag
          fi
