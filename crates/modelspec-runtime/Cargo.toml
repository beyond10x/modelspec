[package]
name = "modelspec-runtime"
description = "The ModelSpec runtime: CPU oracle interpreter and training loop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
vulkan = ["dep:ash", "dep:rspirv"]

[dependencies]
modelspec-core.workspace = true
thiserror.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
ash = { workspace = true, optional = true }
rspirv = { workspace = true, optional = true }

[dev-dependencies]
clap.workspace = true

[[bench]]
name = "mnist_shape"
harness = false

[[bench]]
name = "mlp_sweep"
harness = false
required-features = ["vulkan"]
