version: "3"

tasks:
  build:
    cmds:
      - cargo build --workspace

  test:
    cmds:
      - cargo test --workspace

  lint:
    cmds:
      - cargo fmt --check
      - cargo clippy --workspace --all-targets -- -D warnings

  core-no-vulkan:
    cmds:
      - cargo test -p modelspec-core --test no_vulkan

  check-examples:
    cmds:
      - cargo run -q -p modelspec-cli -- check examples/linear_regression.mspec

  ci:
    cmds:
      - task: build
      - task: lint
      - task: test
      - task: core-no-vulkan
      - task: check-examples
