version: "3"

tasks:
  build:
    cmds:
      - cargo build --workspace

  test:
    cmds:
      - cargo test --workspace
      - cargo test -p modelspec-runtime --features vulkan

  lint:
    cmds:
      - cargo fmt --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo clippy -p modelspec-runtime --features vulkan --all-targets -- -D warnings

  core-no-vulkan:
    cmds:
      - cargo test -p modelspec-core --test no_vulkan

  cli-without-vulkan:
    cmds:
      - cargo test -p modelspec-cli --no-default-features --test inspect_device
      - cargo test -p modelspec-cli --no-default-features --test train_linear --test train_linear_adversary --test checkpoint_vulkan

  check-examples:
    cmds:
      - cargo run -q -p modelspec-cli -- check examples/linear_regression.mspec
      - cargo run -q -p modelspec-cli -- check examples/mnist_mlp.mspec

  docs-generate:
    cmds:
      - cargo run -q -p modelspec-docs -- generate

  docs-check:
    cmds:
      - cargo run -q -p modelspec-docs -- generate --check

  spec-validate:
    dir: spec
    cmds:
      - ess specify validate --path .

  schema-generate:
    desc: Write the JSON Schema of spec/ into crates/modelspec-observatory/schema and crates/modelspec-runtime/schema
    dir: spec
    cmds:
      - ess generate --kind schema --path . --out ../crates/modelspec-observatory
      - ess generate --kind schema --path . --out ../crates/modelspec-runtime

  schema-check:
    desc: Fail when a JSON Schema under crates/modelspec-observatory/schema or crates/modelspec-runtime/schema differs from what spec/ generates
    dir: spec
    cmds:
      - ess generate --kind schema --path . --out ../crates/modelspec-observatory --check
      - ess generate --kind schema --path . --out ../crates/modelspec-runtime --check

  ui-types:
    cmds:
      - cargo run -q -p modelspec-observatory --bin modelspec-ui-types

  ui-types-check:
    cmds:
      - cargo run -q -p modelspec-observatory --bin modelspec-ui-types -- --check

  ui:
    dir: ui
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm typecheck
      - pnpm test
      - pnpm build

  ui-browser:
    cmds:
      - task: ui
      - cargo test -p modelspec-cli --test observatory_ui --test observatory_ui_adversary -- --ignored

  website:
    dir: website
    cmds:
      - npm ci
      - npm run build

  release-check:
    silent: true
    requires:
      vars: [TAG]
    env:
      RELEASE_TAG: "{{.TAG}}"
    cmds:
      - cmd: |
          set -eu
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "release-check: tag '$RELEASE_TAG' is not a bare version such as 0.1.0" >&2
            exit 1
          fi
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$RELEASE_TAG" != "$version" ]; then
            echo "release-check: tag '$RELEASE_TAG' is not the workspace version '$version' in Cargo.toml" >&2
            exit 1
          fi
          if ! awk -v head="## [$RELEASE_TAG] - " 'index($0, head) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "release-check: CHANGELOG.md has no '## [$RELEASE_TAG] - <date>' entry" >&2
            exit 1
          fi
          echo "release-check: $RELEASE_TAG is the workspace version and has a CHANGELOG.md entry"

  ci:
    cmds:
      - task: build
      - task: lint
      - task: test
      - task: core-no-vulkan
      - task: cli-without-vulkan
      - task: check-examples
      - task: docs-check
      - task: spec-validate
      - task: schema-check
      - task: ui-types-check
      - task: ui-browser
